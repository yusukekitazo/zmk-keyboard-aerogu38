manifest:
  defaults:
    revision: main
  remotes:
    - name: cormoran
      url-base: https://github.com/cormoran
    - name: sekigon-gonnoc
      url-base: https://github.com/sekigon-gonnoc
    - name: caksoylar
      url-base: https://github.com/caksoylar
    - name: prospector
      url-base: https://github.com/t-ogura
    - name: kot149
      url-base: https://github.com/kot149
    - name: yusukekitazo
      url-base: https://github.com/yusukekitazo
  projects:
    # ZMK: cormoran fork, main+dya = ZMK main (Zephyr 4.1) base with DYA Studio RPC
    - name: zmk
      remote: cormoran
      revision: main+dya
      import: app/west.yml
    # Trackball driver
    - name: zmk-driver-paw3222
      remote: sekigon-gonnoc
    # RGB LED widget (main supports Zephyr 4.1 / xiao_ble naming)
    - name: zmk-rgbled-widget
      remote: caksoylar
    # DYA Studio modules (main = v4-compatible)
    - name: zmk-module-ble-management
      remote: cormoran
    - name: zmk-module-battery-history
      remote: cormoran
    - name: zmk-module-settings-rpc
      remote: cormoran
    - name: zmk-module-runtime-input-processor
      remote: cormoran
    # Deadzone input processor
    - name: zmk-input-processor-deadzone
      remote: prospector
    # Prospector
    - name: prospector-zmk-module
      remote: prospector
      revision: main
      path: modules/prospector-zmk-module
    # Mouse gesture recognition (&mouse_gesture / gesture_l, ported from aerogu34)
    - name: zmk-mouse-gesture
      remote: kot149
      revision: 62f3c9d8ca6763e160b73efc46108c61dd0243a0 # v1 (2026-08-24)
    # iOS-style scroll inertia (scroll_inertia_v in the right overlay, ported from aerogu34)
    - name: zmk-input-processor-scroll-inertia
      remote: yusukekitazo
      revision: f7dadefee453d555fe066d13a3de3bb60739b45e # main (2026-08-24)
  self:
    path: config
